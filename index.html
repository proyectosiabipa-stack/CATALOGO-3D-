<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="marca/hoja.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="marca/icono-192.png">
<meta name="description" content="Catálogo 3D de productos BIPA para el equipo de ventas.">
<title>Catálogo BIPA 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: escenario 3D tipo estudio fotográfico (arriba en móvil, columna fija a la izquierda en escritorio)
   y una columna de ficha + catálogo que se desplaza. Identidad BIPA: fondo blanco, logo, y los dos verdes
   de la marca (#286a4d / #95cf5f) en botones, acentos y detalles. */
:root {
  --bg: #ffffff;
  --bg-2: #f6f8f3;        /* blanco verdoso para bandas y fondos suaves */
  --surface: #ffffff;
  --surface-2: #f1f5ec;
  --line: rgba(40, 70, 52, .12);
  --line-2: rgba(40, 70, 52, .22);
  --ink: #2a2422;         /* texto principal, café casi negro */
  --muted: #6d625e;
  --faint: #9a908b;
  --green: #286a4d;       /* verde oscuro de la franja */
  --green-2: #1d5139;
  --lime: #95cf5f;        /* verde claro de la franja */
  --lime-soft: #edf6e3;
  --leaf: #7a9a45;        /* verde de la hoja del logo */
  --brown: #7e5b55;       /* café del logotipo */
  --ember: #e8892f;
  --wa: #25d366;
  --shadow: 0 1px 2px rgba(30, 50, 35, .06), 0 8px 24px -10px rgba(30, 50, 35, .18);
  --shadow-lg: 0 2px 6px rgba(30, 50, 35, .08), 0 24px 60px -18px rgba(30, 50, 35, .32);
  --display: "Gloock", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --sans: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --ease: cubic-bezier(.16, .84, .3, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; overflow-x: hidden; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; border-radius: 6px; }
img { max-width: 100%; display: block; }
::selection { background: var(--lime); color: var(--green-2); }

/* acento de color en títulos: los dos verdes de la marca */
.slash { display: inline-flex; gap: 3px; flex-shrink: 0; align-items: center; }
.slash i { display: block; width: 14px; height: 4px; background: var(--green); border-radius: 2px; }
.slash i + i { width: 6px; background: var(--lime); }
.slash i + i + i { display: none; }

.app { display: grid; grid-template-columns: minmax(0, 1fr); }

/* ---------- Escenario ---------- */
.stage { position: relative; height: 66svh; min-height: 440px; max-height: 780px; overflow: hidden; isolation: isolate;
  background: radial-gradient(85% 70% at 46% 46%, #ffffff 0%, #f8faf5 58%, #edf2e8 100%); }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#gl:active { cursor: grabbing; }
.vignette { position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(to bottom, rgba(255, 255, 255, .92), rgba(255, 255, 255, 0) 17%, rgba(255, 255, 255, 0) 60%, rgba(255, 255, 255, .9) 100%); }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
.lbl { position: absolute; left: 0; top: 0; font-family: var(--mono); font-size: 11px; color: var(--green-2); white-space: nowrap; font-weight: 500;
  transform: translate(-50%, -50%); padding: 2px 7px; border-radius: 5px; background: rgba(255, 255, 255, .88);
  border: 1px solid rgba(40, 106, 77, .25); letter-spacing: .02em; will-change: transform; box-shadow: 0 2px 8px -4px rgba(30, 50, 35, .3); }
.lbl.tick { background: none; border: 0; color: var(--faint); font-size: 10px; padding: 0; box-shadow: none; }
.lbl.name { pointer-events: auto; cursor: pointer; font-family: var(--sans); font-size: 11.5px; font-weight: 600; max-width: 96px; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; line-height: 1.2; padding: 4px 7px; transform: translate(-50%, 0); }
.lbl.name.alt { margin-top: 30px; }
@media (max-width: 699px) { .lbl.name { transform-origin: 100% 0; font-size: 10.5px; padding: 3px 6px; } .lbl.name.alt { margin-top: 0; } }
.lbl.name:hover { border-color: var(--green); background: var(--green); color: #fff; }

.topbar { position: absolute; z-index: 3; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 0; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; min-width: 0; }
.brand img { height: 30px; width: auto; }
.brand small { display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  padding-left: 12px; border-left: 1px solid var(--line-2); line-height: 1.3; white-space: nowrap; }
.top-actions { display: flex; gap: 8px; }
.icon-btn { width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; background: rgba(255, 255, 255, .86); color: var(--ink);
  border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); position: relative; box-shadow: var(--shadow);
  transition: border-color .2s, background .2s, color .2s, transform .15s; }
.icon-btn:hover { border-color: var(--green); color: var(--green); }
.icon-btn:active { transform: scale(.95); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn[aria-pressed="true"] { background: var(--green); color: #fff; border-color: var(--green); }

.stage-info { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; padding: 0 16px 16px; display: flex; align-items: flex-end;
  justify-content: space-between; gap: 12px; pointer-events: none; }
.stage-info > * { pointer-events: auto; }
.titleblock { min-width: 0; }
.eyebrow { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--green);
  display: flex; gap: 10px; align-items: center; font-weight: 500; }
.eyebrow #counter { color: var(--faint); }
.titleblock h1 { margin: 6px 0 0; font-family: var(--display); font-weight: 400; font-size: clamp(30px, 8.2vw, 60px); line-height: 1;
  letter-spacing: -.01em; text-wrap: balance; color: var(--ink); }
.nav { display: flex; gap: 8px; flex-shrink: 0; }
.nav .icon-btn { width: 46px; height: 46px; }
.nav .icon-btn#next { background: var(--green); color: #fff; border-color: var(--green); }
.nav .icon-btn#next:hover { background: var(--green-2); }
.tools { position: absolute; z-index: 3; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 66px); display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.tool { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 10px; border-radius: 999px; font-size: 12.5px; color: var(--ink);
  font-weight: 600; background: rgba(255, 255, 255, .86); border: 1px solid var(--line); backdrop-filter: blur(8px); box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(8px); transition: background .2s, color .2s, border-color .2s; justify-content: flex-start; }
.tool:hover { border-color: var(--green); }
.tool svg { width: 16px; height: 16px; flex-shrink: 0; }
.tool[aria-pressed="true"] { background: var(--green); color: #fff; border-color: var(--green); }
.tool .t { display: none; }
.hint { position: absolute; z-index: 2; left: 50%; top: 46%; transform: translate(-50%, -50%); font-family: var(--mono); font-size: 11px;
  color: var(--green-2); background: rgba(255, 255, 255, .9); border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px;
  pointer-events: none; white-space: nowrap; opacity: 0; box-shadow: var(--shadow); }

/* ---------- Presentación (pantalla completa con avance automático) ---------- */
.present-bar { position: absolute; z-index: 4; left: 0; right: 0; top: 0; height: 3px; background: rgba(40, 106, 77, .12); display: none; }
.present-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--green), var(--lime)); }
.presenting .present-bar { display: block; }
.presenting .tools .tool:not(#tPresent), .presenting #searchJump { display: none; }
.stage:fullscreen { height: 100vh; max-height: none; }
.stage:-webkit-full-screen { height: 100vh; max-height: none; }

/* ---------- Cargador ---------- */
.loader { position: fixed; inset: 0; z-index: 50; background: #fff; display: grid; place-items: center; overflow: hidden; }
.loader-inner { display: grid; justify-items: center; gap: 22px; position: relative; z-index: 1; }
.loader .logo { width: min(240px, 60vw); height: auto; }
.loader .bar { width: 160px; height: 3px; background: var(--lime-soft); border-radius: 3px; overflow: hidden; }
.loader .bar i { display: block; height: 100%; width: 40%; background: var(--green); border-radius: 3px; animation: load 1.2s var(--ease) infinite; }
.loader p { margin: 0; font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
@keyframes load { from { transform: translateX(-100%); } to { transform: translateX(260%); } }

/* ---------- Columna ---------- */
.panel { border-top: 1px solid var(--line); padding-inline: 16px; padding-block: 18px 120px; display: flex; flex-direction: column; gap: 40px; min-width: 0; background: var(--bg); }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.section-head h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 27px; line-height: 1.1; display: flex; align-items: center; gap: 12px; }
.section-head > span { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .06em; }

.detail { display: flex; flex-direction: column; gap: 22px; }
.chips-row { display: flex; flex-wrap: wrap; gap: 8px; }
.seal { font-size: 12px; font-weight: 600; padding: 5px 11px 5px 8px; border-radius: 999px; border: 1px solid rgba(40, 106, 77, .2);
  color: var(--green); display: inline-flex; align-items: center; gap: 6px; background: var(--lime-soft); }
.seal svg { width: 13px; height: 13px; }
.seal.note { color: #9a5a17; border-color: rgba(232, 137, 47, .3); background: #fdf3e7; }
.desc { margin: 0; color: var(--muted); font-size: 16px; max-width: 58ch; }
.specs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-radius: 16px; background: var(--bg-2); border: 1px solid var(--line); padding: 0 14px; margin: 0; }
.specs[data-n="1"] { grid-template-columns: minmax(0, 1fr); }
.specs[data-n="2"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.specs[data-n="4"] { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 520px) {
  .specs[data-n="4"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .specs[data-n="4"] .spec:nth-child(3) { padding-left: 0; border-left: 0; }
  .specs[data-n="4"] .spec:nth-child(n+3) { border-top: 1px solid var(--line); }
}
.spec { padding: 13px 0; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.spec + .spec { padding-left: 12px; border-left: 1px solid var(--line); }
.spec dt { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--green); }
.spec dd { margin: 0; font-family: var(--display); font-size: clamp(19px, 5.4vw, 24px); line-height: 1.15; font-variant-numeric: tabular-nums; }
.spec dd small { font-family: var(--sans); font-size: 13px; color: var(--muted); }
.group-label { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--green); margin: 0 0 10px; font-weight: 500; }
.group-label b { color: var(--ink); font-weight: 600; letter-spacing: .02em; text-transform: none; font-family: var(--sans); font-size: 13px; margin-left: 6px; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch { width: 36px; height: 36px; border-radius: 50%; border: 2px solid transparent; padding: 3px; background: none; transition: transform .15s; }
.swatch:hover { transform: scale(1.08); }
.swatch i { display: block; width: 100%; height: 100%; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12), inset 0 -4px 8px rgba(0, 0, 0, .18), inset 0 2px 4px rgba(255, 255, 255, .45); }
.swatch[aria-pressed="true"] { border-color: var(--green); }
.aroma { font-size: 13px; font-weight: 500; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line-2); background: #fff;
  display: inline-flex; align-items: center; gap: 8px; transition: background .2s, border-color .2s, color .2s; }
.aroma:hover { border-color: var(--green); }
.aroma i { width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .15); }
.aroma[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; }

.packs { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.pack { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.pack-main { min-width: 0; }
.pack-main strong { display: block; font-size: 15.5px; font-weight: 600; }
.pack-main span { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.pack-side { display: flex; align-items: center; gap: 12px; }
.price { font-family: var(--mono); font-size: 12.5px; color: var(--faint); text-align: right; white-space: nowrap; }
.price.has { color: var(--green-2); font-size: 15px; font-weight: 500; }

.actions { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.actions .btn.wa, .actions .btn.primary { grid-column: 1 / -1; }
.btn { height: 50px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-weight: 700; color: var(--ink);
  font-size: 14.5px; text-decoration: none; border: 1px solid var(--line-2); background: #fff; transition: transform .15s, background .2s, border-color .2s, color .2s; padding: 0 14px; }
.btn:hover { border-color: var(--green); color: var(--green); }
.btn:active { transform: scale(.98); }
.btn svg { width: 19px; height: 19px; flex-shrink: 0; }
.btn.wa { background: var(--wa); color: #05301a; border-color: var(--wa); }
.btn.wa:hover { background: #1fc25c; color: #05301a; }
.btn.primary { background: var(--green); color: #fff; border-color: var(--green); }
.btn.primary:hover { background: var(--green-2); color: #fff; }
.zoom { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 24px; background: rgba(250, 252, 248, .94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); cursor: zoom-out; }
.zoom[hidden] { display: none; }
.zoom img { max-width: min(100%, 720px); max-height: calc(100dvh - 48px); border-radius: 16px; background: #fff; box-shadow: var(--shadow-lg); }
.zoom-actions { display: none; position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%); gap: 10px; }
.zoom-actions .btn { min-width: 140px; box-shadow: var(--shadow-lg); }
.zoom.ficha .zoom-actions { display: flex; }
.zoom.ficha img { max-height: calc(100dvh - 130px); cursor: default; }
.zoom .zoom-close { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px); right: 14px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--green); color: #fff; font-size: 26px; line-height: 1; cursor: pointer; }

/* ---------- Catálogo ---------- */
.search { position: relative; margin-bottom: 12px; }
.search svg { position: absolute; left: 14px; top: 50%; width: 17px; height: 17px; transform: translateY(-50%); color: var(--green); }
.search input { width: 100%; height: 48px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--bg-2); color: var(--ink);
  font: inherit; font-size: 15px; padding: 0 14px 0 42px; transition: border-color .2s, background .2s, box-shadow .2s; }
.search input:focus { outline: none; border-color: var(--green); background: #fff; box-shadow: 0 0 0 4px rgba(149, 207, 95, .3); }
.search input::placeholder { color: var(--faint); }
.cats { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px 16px; padding: 2px 16px; }
.cats::-webkit-scrollbar { display: none; }
.cat { flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-2); background: #fff; font-size: 13px; font-weight: 600; white-space: nowrap; transition: background .2s, color .2s, border-color .2s; }
.cat:hover { border-color: var(--green); }
.cat span { font-family: var(--mono); font-weight: 400; font-size: 11px; color: var(--muted); margin-left: 4px; }
.cat[aria-pressed="true"] { background: var(--green); color: #fff; border-color: var(--green); }
.cat[aria-pressed="true"] span { color: var(--lime); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.card { text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 18px; padding: 0; overflow: hidden; position: relative;
  display: flex; flex-direction: column; transition: border-color .25s, transform .25s var(--ease), box-shadow .25s; min-width: 0; box-shadow: var(--shadow); }
.card:hover { border-color: rgba(40, 106, 77, .35); transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.card[aria-current="true"] { border-color: var(--green); box-shadow: 0 0 0 1px var(--green), var(--shadow-lg); }
.card[aria-current="true"]::after { content: ""; position: absolute; top: 12px; right: 12px; width: 12px; height: 12px; z-index: 2; border-radius: 50%;
  background: var(--lime); box-shadow: 0 0 0 3px #fff, 0 0 0 4.5px var(--green); }
.thumb { aspect-ratio: 1; position: relative; background: radial-gradient(75% 65% at 50% 42%, #ffffff, #f2f6ee 70%, #e9efe3); }
.thumb img { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .5s, transform .5s var(--ease); }
.card:hover .thumb img { transform: scale(1.04); }
.thumb img:not([src]) { visibility: hidden; }
.thumb img.on { opacity: 1; }
.thumb .ph { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 34px; color: #dde6d5; }
.thumb .cm { position: absolute; left: 10px; top: 10px; z-index: 2; font-family: var(--mono); font-size: 10.5px; color: var(--green-2); background: rgba(255, 255, 255, .85);
  padding: 2px 7px; border-radius: 5px; border: 1px solid var(--line); }
.card-body { padding: 10px 12px 13px; display: flex; flex-direction: column; gap: 3px; min-width: 0; border-top: 1px solid var(--line); }
.card-body strong { font-size: 14px; font-weight: 600; line-height: 1.25; }
.card-body span { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.card-body .dots { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.card-body .dots i { width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
.empty { grid-column: 1 / -1; padding: 30px 0; text-align: center; color: var(--muted); }

/* herramientas de venta */
.kit { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.kit button { border: 1px solid var(--line); background: var(--bg-2); border-radius: 16px; padding: 14px 12px; text-align: left; display: flex; flex-direction: column; gap: 8px;
  transition: border-color .2s, background .2s, transform .15s; min-width: 0; }
.kit button:hover { border-color: var(--green); background: #fff; }
.kit button:active { transform: scale(.98); }
.kit svg { width: 22px; height: 22px; color: var(--green); }
.kit button > div { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.kit strong { font-size: 13.5px; font-weight: 700; line-height: 1.2; }
.kit span { font-size: 12px; color: var(--muted); line-height: 1.3; }
@media (max-width: 420px) { .kit { grid-template-columns: minmax(0, 1fr); } .kit button { flex-direction: row; align-items: center; } } 

.foot { position: relative; overflow: hidden; border-radius: 22px; background: var(--bg-2); border: 1px solid var(--line); border-top: 4px solid var(--green); padding: 26px 22px;
  display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 12.5px; }
.foot .logo { width: 150px; height: auto; margin-bottom: 8px; }
.foot a { color: var(--green); font-weight: 600; text-decoration: none; }


.toast { position: fixed; z-index: 60; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 16px); transform: translate(-50%, -20px); opacity: 0;
  background: var(--green); color: #fff; font-weight: 600; font-size: 13.5px; padding: 10px 16px; border-radius: 999px; pointer-events: none; box-shadow: var(--shadow-lg);
  transition: opacity .25s, transform .35s var(--ease); max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Escritorio ---------- */
@media (min-width: 980px) {
  .app { grid-template-columns: minmax(0, 1.45fr) minmax(400px, 1fr); }
  .stage { position: sticky; top: 0; align-self: start; height: 100svh; max-height: none; }
  .topbar { padding: 24px 28px 0 30px; }
  .brand img { height: 36px; }

<!-- ================= Interfaz (funciona aunque el 3D no cargue) ================= -->
<script>
(function () {
  "use strict";
  var D = window.CATALOGO || { empresa: {}, categorias: [], productos: [] };
  var E = D.empresa || {};
  var P = D.productos || [];
  var gs = window.gsap;
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var $ = function (s) { return document.querySelector(s); };

  var COLORS = {
    "Blanco": "#f4eee2", "Blancas": "#f4eee2", "Marfil": "#efe1bf", "Azul": "#3150b8", "Amarillo": "#f1c232",
    "Verde": "#5e9e43", "Morado": "#7647ad", "Rojo": "#c3302c", "Rosado": "#f0a6bb", "Colores mixtos": "mix"
  };
  var AROMAS = {
    "Cherry": "#b5203a", "Canela": "#8a4a22", "Citronela": "#c9d34a", "Coco": "#efe7d6", "Manzana y canela": "#b8442a",
    "Coco y limón": "#d9e48a", "Arándanos": "#4b2f7a", "Sándalo": "#9a6a3f", "Vainilla y jazmín": "#f1dfae",
    "Piña colada": "#f2d36b", "Palmera": "#4f9a5a", "La Frut": "#e86a5a", "Dulce popurrí": "#d27bb0",
    "Vainilla y canela": "#e4c48c", "Mar Caribe": "#2aa7c9", "Chutney de arándano": "#b0283c", "Blueberry": "#1f4f93", "Citronela y limón": "#8dbb2c", "Fresa silvestre": "#c0262f", "Mandarina": "#ef7a2e", "Mango y tangerine": "#f39a2e", "Mango y mandarina": "#f39a2e"
  };
  window.BIPA_COLORS = COLORS; window.BIPA_AROMAS = AROMAS;

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function cm(n) { return String(n).replace(".", ","); }
  function catName(id) { var c = (D.categorias || []).filter(function (x) { return x.id === id; })[0]; return c ? c.nombre : ""; }
  function money(v) { return v == null || v === "" ? "Consultar" : (E.moneda || "S/") + " " + Number(v).toFixed(2); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || "null"); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }

  var I = {
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    minus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>',
    wa: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.7.3-.2.3-.9.9-.9 2.2s1 2.5 1.1 2.7c.1.2 1.9 2.9 4.6 4 1.7.7 2.4.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.4-.3z"/></svg>',
    image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4.5-4.5L6 21"/></svg>',
    flame: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2.5 1.5-4 2.5-5 0 2 1 3 2 3 0-3-.5-6 .5-9z"/></svg>'
  };

  var S = { idx: 0, color: null, aroma: null, cat: "todos", q: "", flame: true, spin: !reduce, scale: false, thumbs: {} };
  var visor = null;

  // ---------- Marca ----------
  $("#footContact").innerHTML = [E.origen ? esc(E.origen) : "", E.web ? '<a href="https://' + esc(E.web.replace(/^https?:\/\//, "")) + '" target="_blank" rel="noopener">' + esc(E.web) + '</a>' : "",
    E.instagram ? '<a href="https://instagram.com/' + esc(E.instagram) + '" target="_blank" rel="noopener">@' + esc(E.instagram) + '</a>' : ""].filter(Boolean).join(" · ");

  function current() { return P[S.idx]; }

  // ---------- Ficha ----------
  function specsHtml(p) {
    var m = p.modelo || {}, cells = [];
    var ax = m.aprox ? "≈" : "";
    if (m.alto) cells.push(["Alto", ax + cm(m.alto) + ' <small>cm</small>']);
    if (m.diametro) cells.push(["Diámetro", ax + cm(m.diametro) + ' <small>cm</small>']);
    if (p.pesoUnidad) cells.push([esc(p.pesoNombre || "Peso unidad"), esc(p.pesoUnidad).replace(/\s(kg|g)$/, ' <small>$1</small>')]);
    var first = (p.presentaciones || [])[0];
    if (first && cells.length < 4) {
      var num = (first.contenido || "").match(/^\d+/);
      cells.push([first.empaque || "Empaque", num ? num[0] + ' <small>' + esc(first.contenido.replace(/^\d+\s*/, "")) + '</small>' : '<small>' + esc(first.contenido) + '</small>']);
    }
    if (first && first.peso && cells.length < 3) cells.push(["Peso", esc(first.peso).replace(/\s(kg|g)$/, ' <small>$1</small>')]);
    if (!cells.length) return "";
    return '<dl class="specs" data-n="' + cells.length + '">' + cells.map(function (c) {
      return '<div class="spec"><dt>' + c[0] + '</dt><dd>' + c[1] + '</dd></div>'; }).join("") + '</dl>';
  }
  function swatchBg(name) {
    var c = COLORS[name];
    if (c === "mix") return "conic-gradient(#c3302c 0 25%, #f1c232 0 50%, #3150b8 0 75%, #5e9e43 0)";
    return c || "#ccc";
  }

  function renderDetail() {
    var p = current(); if (!p) return;
    var h = "";
    var seals = (p.destacados || []).map(function (s) { return '<span class="seal">' + I.check + esc(s) + '</span>'; });
    if (p.nota) seals.push('<span class="seal note">' + esc(p.nota) + '</span>');
    if (seals.length) h += '<div class="chips-row">' + seals.join("") + '</div>';
    if (p.descripcion) h += '<p class="desc">' + esc(p.descripcion) + '</p>';
    h += specsHtml(p);
    if (p.colores && p.colores.length) {
      h += '<div><p class="group-label">Color<b id="colorName">' + esc(S.color) + '</b></p><div class="swatches">' + p.colores.map(function (c) {
        return '<button class="swatch" data-color="' + esc(c) + '" aria-pressed="' + (c === S.color) + '" aria-label="' + esc(c) + '" title="' + esc(c) + '"><i style="background:' + swatchBg(c) + '"></i></button>';
      }).join("") + '</div></div>';
    }
    if (p.aromas && p.aromas.length) {
      h += '<div><p class="group-label">Aromas<b>' + p.aromas.length + ' disponibles</b></p><div class="chips-row">' + p.aromas.map(function (a) {
        return '<button class="aroma" data-aroma="' + esc(a) + '" aria-pressed="' + (a === S.aroma) + '"><i style="background:' + (AROMAS[a] || "#aaa") + '"></i>' + esc(a) + '</button>';
      }).join("") + '</div></div>';
    }
    if (p.presentaciones && p.presentaciones.length) {
      h += '<div><p class="group-label">Presentaciones</p><div class="packs">' + p.presentaciones.map(function (pr) {
        var meta = [pr.contenido, pr.peso].filter(Boolean).join(" · ");
        return '<div class="pack"><div class="pack-main"><strong>' + esc(pr.empaque) + '</strong><span>' + esc(meta) + '</span></div>' + (pr.precio != null ? '<div class="pack-side"><span class="price has">' + money(pr.precio) + '</span></div>' : '') + '</div>';
      }).join("") + '</div></div>';
    }
    h += '<div class="actions"><button class="btn wa" id="shareWa">' + I.wa + 'Enviar ficha por WhatsApp</button>' +
         '<button class="btn primary" id="imgFicha">' + I.image + 'Ficha en imagen</button></div>';
    $("#detail").innerHTML = h;
  }

  // ---------- Escenario ----------
  function renderStage(animate) {
    var p = current(); if (!p) return;
    $("#eyebrow").textContent = catName(p.categoria);
    $("#counter").textContent = pad(S.idx + 1) + " / " + pad(P.length);
    var h1 = $("#pName");
    if (animate && gs && !reduce) {
      gs.timeline().to(h1, { y: -14, opacity: 0, duration: .22, ease: "power2.in" })
        .add(function () { h1.textContent = p.nombre; })
        .fromTo(h1, { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: .6, ease: "expo.out" });
    } else h1.textContent = p.nombre;
    document.title = p.nombre + " · Catálogo " + (E.nombre || "BIPA");
  }

  function select(i, opts) {
    opts = opts || {};
    if (!P.length) return;
    S.idx = (i + P.length) % P.length;
    var p = current();
    S.color = p.colores && p.colores.length ? p.colores[0] : null;
    S.aroma = p.aromas && p.aromas.length ? p.aromas[0] : null;
    if (S.scale) setScale(false, true);
    renderStage(opts.animate !== false);
    renderDetail();
    markCards();
    if (visor) visor.show(p, { color: S.color, aroma: S.aroma, dir: opts.dir || 1 });
    present.start = performance.now();
    try { history.replaceState(null, "", "#" + p.id); } catch (e) {}
    if (opts.scrollTop) {
      var st = $("#stage");
      var y = window.innerWidth >= 980 ? 0 : st.getBoundingClientRect().top + window.scrollY;
      window.scrollTo({ top: y, behavior: reduce ? "auto" : "smooth" });
    }
    if (gs && !reduce && opts.animate !== false) gs.from("#detail > *", { y: 14, opacity: 0, duration: .5, stagger: .05, ease: "power3.out", clearProps: "all" });
  }

  // ---------- Catálogo ----------
  function filtered() {
    var q = S.q.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    return P.map(function (p, i) { return { p: p, i: i }; }).filter(function (o) {
      if (S.cat !== "todos" && o.p.categoria !== S.cat) return false;
      if (!q) return true;
      var hay = [o.p.nombre, o.p.descripcion, catName(o.p.categoria)].concat(o.p.aromas || [], o.p.colores || []).join(" ").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
      return hay.indexOf(q) > -1;
    });
  }
  function renderCats() {
    var cats = [{ id: "todos", nombre: "Todos" }].concat(D.categorias || []);
    $("#cats").innerHTML = cats.map(function (c) {
      var n = c.id === "todos" ? P.length : P.filter(function (p) { return p.categoria === c.id; }).length;
      return '<button class="cat" data-cat="' + esc(c.id) + '" aria-pressed="' + (S.cat === c.id) + '">' + esc(c.nombre) + '<span>' + n + '</span></button>';
    }).join("");
  }
  function cardMeta(p) {
    var m = p.modelo || {}, pr = (p.presentaciones || [])[0];
    var bits = [];
    if (pr) bits.push(pr.empaque + " · " + pr.contenido);
    return bits.join("");
  }
  function renderGrid() {
    var list = filtered();
    $("#catCount").textContent = list.length + (list.length === 1 ? " producto" : " productos");

    if (animate) {
